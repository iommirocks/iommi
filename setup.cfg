[hammett]
DJANGO_SETTINGS_MODULE = tests.settings
plugins=
    pytest_django
    pytest_snapshot
    time_machine

[mutmut]
# runner = python -m hammett -x
;runner = python -m pytest -x
paths_to_mutate=iommi/
pytest_add_cli_args=
    -n0
    -p
    no:cacheprovider
paths_to_exclude =
    style_*.py
dict_synonyms=Struct, Namespace, Shortcut
# A mutant that runs 3x longer than the clean run is hung (default 15x stalls workers for ~15 min each)
timeout_multiplier=3
pytest_add_cli_args_test_selection=
    tests
    iommi
    docs
do_not_mutate=
    *__tests.py
also_copy=
    README.rst
    README_pypi.rst
    iommi/templates/
    iommi/locale/
    iommi/snapshots/
    docs/
    tests/
    setup.cfg
    conftest.py
    examples/
    pyproject.toml
    benchmarks/
    homepage/
