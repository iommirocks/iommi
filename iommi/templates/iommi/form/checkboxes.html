{% for choice in field.choice_tuples %}
    <div{% block item_attrs %}{{ field.attrs }}{% endblock %}>
        <input type="checkbox" value="{{ choice.1|stringformat:'s' }}" id="{{ field.extra_evaluated.id }}_{{ choice.4 }}" {{ field.input.attrs }} {% if choice.3 %}checked{% endif %}/>
        <label{% block label_attrs %}{% endblock %} for="{{ field.extra_evaluated.id }}_{{ choice.4 }}">{{ choice.2 }}</label>
    </div>
{% endfor %}
