{% extends "iommi/query/advanced.html" %}
{% load i18n %}
{% block search_input %}
    <label class="label" for="iommi_{{ query.iommi_dunder_path }}_query">{% blocktrans %}Search query{% endblocktrans %}:</label>
    <input id="iommi_{{ query.iommi_dunder_path }}_query" name="{{ query.get_advanced_query_param }}" type="text" class="input input-bordered w-full" data-query="{{ query.query_advanced_value }}"/>
{% endblock %}
{# Tailwind's reset strips heading and list styles #}
{% block help_class %} [&_h3]:text-xl [&_h3]:font-bold [&_h3]:mb-2 [&_ul]:list-disc [&_ul]:list-inside [&_.small]:text-sm{% endblock %}
